
name: Generar APK UMC22

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Extraer proyecto
        run: |
          unzip -q UMC22-LIVE-MIXER-GitHub-Starter.zip
          cp -a UMC22-LIVE-MIXER/. .

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: UMC22-LIVE-MIXER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
